<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Virtual Wurlitzer 166</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Virtual Wurlitzer 166</h1>
        <div class="controls">
            <div class="file-group">
                <label>1. Load Organ (.sf2)</label>
                <input type="file" id="soundfont-upload" accept=".sf2,.sf3">
            </div>
            <div class="file-group">
                <label>2. Load Song (.mid)</label>
                <input type="file" id="midi-upload" accept=".mid,.midi">
            </div>
            <div class="playback-controls">
                <button id="play-btn" disabled>▶ Play MIDI</button>
                <button id="stop-btn" disabled>■ Stop</button>
            </div>
        </div>
    </header>

    <main>
        <div id="stops-container" class="stops-panel"></div>

        <div class="keyboards-panel">
            <div class="keyboard" data-name="Trumpet Melody"></div>
            <div class="keyboard" data-name="Accompaniment"></div>
            <div class="keyboard" data-name="Countermelody & Bass"></div>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
